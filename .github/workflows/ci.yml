name: CI

on:
  pull_request:

permissions:
  contents: read
  # gitleaks-action enumerates the PR's commits via the API on pull_request runs;
  # without this it fails with "403 Resource not accessible by integration".
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Postgres for the DB-integration suite. The `postgres` superuser is required by the
    # role-isolation test (SET ROLE needs membership/superuser). Without this service the
    # ci-guard test fails, so the DB suite can never silently skip on a PR.
    #
    # Redis backs the BullMQ worker/queue integration suite (Task 2.1). Same contract: the
    # queue ci-guard test fails if TEST_REDIS_URL is unset, so those tests can never silently
    # skip on a PR.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # DB-B: the isolated raw store (ADR 0008 Move 2). A SEPARATE Postgres service (its own
      # cluster) — NOT a second database on the DB-A server — so its cluster-global roles are
      # independent of DB-A's. A shared cluster would break the schema-roundtrip / roles-
      # pre-provisioned DROP ROLE tests (a role cannot be dropped while another DB on the same
      # cluster holds grants on it). This mirrors production, where DB-A and DB-B are separate
      # Railway Postgres services. The two-DB suites skip without TEST_RAW_DATABASE_URL.
      postgres_raw:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE test: `npm run model:fetch` executes from dist/, and the
      # model-gated redaction suites (recall gate, no-egress) need the weights.
      - name: Build
        run: npm run build

      # Vendored NER model for the Task 4.1 redaction suites. Cached by lockfile +
      # model id; on a cache hit model:fetch is a near-no-op. The redaction ci-guard
      # test fails if TEST_NER_MODEL_DIR is unset, so the recall gate can never
      # silently skip on a PR.
      - name: Cache NER model
        uses: actions/cache@v4
        with:
          path: models
          key: ner-model-${{ hashFiles('package-lock.json') }}-Xenova/bert-base-NER

      - name: Fetch NER model
        run: npm run model:fetch

      - name: Test
        run: npm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # DB-B (raw store) — the second Postgres service above (ADR 0008 Move 2). The DB-B
          # suites self-migrate the raw set via migrateRaw('up') in beforeAll.
          TEST_RAW_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres
          TEST_REDIS_URL: redis://localhost:6379
          TEST_NER_MODEL_DIR: models

      - name: Audit dependencies
        run: npm audit --audit-level=high

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for gitleaks-action only on GitHub
          # organisations. Personal/public repos run without it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
